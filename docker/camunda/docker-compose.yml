include:
  - ../sequin-docker-compose/docker-compose.ci.yaml

name: camunda

services:
  camunda_postgres:
    image: postgres:16
    ports:
      - "7477:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_buffers=512MB", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=2GB", "-c", "max_connections=200"]
    volumes:
      - camunda_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d camunda"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          memory: 1GB

  camunda:
    image: camunda/camunda-bpm-platform:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom
    depends_on:
      camunda_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3GB
        reservations:
          memory: 2GB

volumes:
  camunda_postgres_data:

# Un-comment this to enable IPv6
# You may need to run
# `docker compose down --volumes --remove-orphans`
# to remove the existing network and start fresh
#
# networks:
#   default:
#     enable_ipv6: true
#     ipam:
#       config:
#         - subnet: "2001:db8:1::/64"
